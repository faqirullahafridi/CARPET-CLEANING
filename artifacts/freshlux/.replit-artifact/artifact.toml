kind = "web"
previewPath = "/"
title = "FreshLux Carpet Cleaning UK"
version = "1.0.0"
id = "artifacts/freshlux"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18648

[services.development]
run = "pnpm --filter @workspace/freshlux run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freshlux", "run", "build" ]
publicDir = "artifacts/freshlux/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18648"
BASE_PATH = "/"
