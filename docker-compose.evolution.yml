services:
  postgres:
    image: postgres:16-alpine
    container_name: carpet-clean-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: carpet-clean-evolution-redis
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: carpet-clean-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./evolution/.env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  evolution_pg:
